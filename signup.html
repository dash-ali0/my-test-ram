  <section class="container">
    <h2>ثبت‌نام کاربر</h2>
    <form id="signupForm" class="form-box" onsubmit="return handleSignup(event)">
      <label>نام کامل:</label>
      <input id="signupName" type="text" required>
      <label>ایمیل:</label>
      <input id="signupEmail" type="email" required>
      <label>رمز عبور:</label>
      <input id="signupPassword" type="password" minlength="6" required>
      <button type="submit" class="btn">ثبت‌نام</button>
      <p id="signupMsg" class="form-msg"></p>
    </form>
  </section>

    <p>© 2025 فروشگاه رام</p>
  </footer>
