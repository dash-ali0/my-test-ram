    <form id="contactForm" class="form-box" onsubmit="return handleContact(event)">

      <input id="contactName" type="text" placeholder="نام شما" required>
      <label>ایمیل:</label>
      <input id="contactEmail" type="email" placeholder="ایمیل شما" required>
      <label>پیام:</label>
      <textarea id="contactMessage" placeholder="پیام شما" required></textarea>
      <button type="submit" class="btn">ارسال</button>
      <p id="contactMsg" class="form-msg"></p>
